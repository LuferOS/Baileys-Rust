[package]
name = "baileys-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
aes = "0.8"
aes-gcm = "0.10"
base64 = "0.22"
bytes = "1"
cbc = { version = "0.1", features = ["alloc"] }
cipher = { version = "0.4", features = ["alloc", "block-padding"] }
ctr = "0.9"
curve25519-dalek = "4"
flate2 = "1"
hkdf = "0.12"
hmac = "0.12"
md-5 = "0.10"
pbkdf2 = { version = "0.12", features = ["hmac"] }
prost = "0.13"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
thiserror = "2"
x25519-dalek = { version = "2", features = ["static_secrets"] }

[build-dependencies]
prost-build = "0.13"
